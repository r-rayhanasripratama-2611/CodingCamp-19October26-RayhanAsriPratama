<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Life Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

  <div id="warning" role="alert" hidden></div>

  <!-- Greeting Widget -->
  <section id="greeting" class="card" aria-label="Greeting">
    <div id="clock">00:00</div>
    <div id="date"></div>
    <div id="greeting-text"></div>
    <div class="greeting-controls">
      <div class="name-control">
        <label class="field-label" for="name-input">Your name</label>
        <div class="form-row">
          <input type="text" id="name-input" maxlength="40" placeholder="Enter your name" autocomplete="given-name">
          <button type="button" id="save-name" class="small">Save name</button>
        </div>
      </div>
      <button type="button" id="theme-toggle" class="secondary">Switch to Light Mode</button>
    </div>
  </section>

  <div class="grid">

    <!-- Focus Timer -->
    <section id="timer-card" class="card" aria-labelledby="timer-title">
      <h2 id="timer-title">Focus Timer</h2>
      <div id="timer-display" aria-label="Remaining time">25:00</div>
      <div id="timer-status" aria-live="polite">Ready</div>
      <div id="timer-message" aria-live="polite"></div>
      <div class="btn-row">
        <button type="button" id="timer-start">Start</button>
        <button type="button" id="timer-stop" class="secondary">Stop</button>
        <button type="button" id="timer-reset" class="secondary">Reset</button>
      </div>
      <div class="timer-settings">
        <label class="field-label" for="pomodoro-minutes">Focus duration (minutes)</label>
        <div class="form-row">
          <input type="number" id="pomodoro-minutes" min="1" max="180" step="1" value="25">
          <button type="button" id="apply-duration" class="small">Apply</button>
        </div>
        <p class="error" id="timer-error" role="alert"></p>
      </div>
    </section>

    <!-- To-Do List -->
    <section id="todo-card" class="card" aria-labelledby="todo-title">
      <h2 id="todo-title">To-Do List</h2>
      <form id="todo-form" novalidate>
        <label class="field-label" for="todo-input">New task</label>
        <div class="form-row">
          <div class="grow"><input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off"></div>
          <button type="submit">Add task</button>
        </div>
        <p class="error" id="todo-error" role="alert"></p>
      </form>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links -->
    <section id="links-card" class="card" aria-labelledby="links-title">
      <h2 id="links-title">Quick Links</h2>
      <ul id="links-list"></ul>
      <form id="link-form" novalidate>
        <div class="form-row">
          <div class="grow">
            <label class="field-label" for="link-name">Name</label>
            <input type="text" id="link-name" placeholder="e.g. GitHub" autocomplete="off">
          </div>
          <div class="grow">
            <label class="field-label" for="link-url">URL</label>
            <input type="text" id="link-url" placeholder="https://github.com" autocomplete="off" inputmode="url">
          </div>
        </div>
        <button type="submit">Add link</button>
        <p class="error" id="link-error" role="alert"></p>
      </form>
    </section>

  </div>
</div>
<script src="js/script.js" defer></script>
</body>
</html>
